<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به دفتر مالی</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f6f8;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      min-height: 24px;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>دفتر مالی من</h1>

    <label for="email">ایمیل</label>
    <input
      type="email"
      id="email"
      placeholder="ایمیل خود را وارد کنید"
      autocomplete="email"
    >

    <label for="password">رمز عبور</label>
    <input
      type="password"
      id="password"
      placeholder="رمز عبور"
      autocomplete="current-password"
    >

    <button onclick="login()">ورود</button>

    <div id="message"></div>
  </div>

  <script>
    // این دو مقدار را بعداً با اطلاعات پروژه Supabase خودمان جایگزین می‌کنیم.
    const SUPABASE_URL = "https://hjjorrgmqtzamjxvjmot.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_yr3BIQAa8Vk_yE110Bg1-A_W5udedrN";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (!email || !password) {
        message.textContent = "لطفاً ایمیل و رمز عبور را وارد کنید.";
        return;
      }

      message.textContent = "در حال ورود...";

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        message.textContent = "ایمیل یا رمز عبور اشتباه است.";
        return;
      }

      window.location.href = "index.html";
    }
  </script>

</body>
</html>
